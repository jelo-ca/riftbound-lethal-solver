[pytest]
# Three generation tests account for essentially the entire suite runtime
# (748s of 760s measured 2026-09-16); the other 510 tests finish in about
# twelve seconds. They are slow for a legitimate reason — they sample
# random positions and solve each one — but generation is deferred behind
# the solver MVP, so paying twelve minutes for it on every run is paying
# for work nobody is doing.
#
# They are DESELECTED, not deleted. Run them with:
#   py -m pytest solver/tests -m slow
# or the whole suite including them with:
#   py -m pytest solver/tests -m ""
addopts = -m "not slow"

markers =
    slow: samples and solves many random positions; minutes, not seconds
